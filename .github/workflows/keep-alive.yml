name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping al backend
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 20 --max-time 90 \
            https://kanbia.onrender.com/api/health